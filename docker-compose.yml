services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sinana_uploads:/app/instance/uploads
    ports:
      - "127.0.0.1:8001:8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sinana
      POSTGRES_USER: sinana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinana -d sinana"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sinana_db:/var/lib/postgresql/data

volumes:
  sinana_db:
  sinana_uploads:

